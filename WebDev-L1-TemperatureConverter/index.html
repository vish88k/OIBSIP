<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple and responsive temperature converter using HTML, CSS and JavaScript."
    >

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
   
</head>

<body>

    <main class="converter-container">

        <section class="converter-card" aria-labelledby="converter-title">

            <div class="header">
                <span class="badge">OIBSIP • Task 3</span>

                <h1 id="converter-title">Temperature Converter</h1>

                <p>
                    Convert temperatures between Celsius, Fahrenheit and Kelvin.
                </p>
            </div>

            <form id="temperatureForm">

                <div class="form-group">
                    <label for="temperature">Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        name="temperature"
                        placeholder="Enter temperature"
                        step="any"
                        autocomplete="off"
                        aria-describedby="errorMessage"
                    >
                </div>

                <div class="form-group">
                    <label for="unit">Convert from</label>

                    <select id="unit" name="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button type="submit" id="convertButton">
                    Convert Temperature
                </button>
                <button type="button" id="resetBtn" class="reset-btn">
                    Reset
                </button>
                

            </form>
            <div class="formula-box">
                <h3>Conversion Formulas</h3>
            
                <p>°F = (°C × 9/5) + 32</p>
                <p>°C = (°F − 32) × 5/9</p>
                <p>K &nbsp;= °C + 273.15</p>
            </div>

            <p
                id="errorMessage"
                class="error-message"
                role="alert"
                aria-live="polite"
            ></p>

            <section
                id="result"
                class="result"
                aria-live="polite"
                aria-label="Conversion result"
            >
                <p class="result-title">Converted Temperature</p>

                <div class="temperature-results">

                    <div class="temperature-box">
                        <span>Celsius</span>
                        <strong id="celsiusResult">--</strong>
                    </div>

                    <div class="temperature-box">
                        <span>Fahrenheit</span>
                        <strong id="fahrenheitResult">--</strong>
                    </div>

                    <div class="temperature-box">
                        <span>Kelvin</span>
                        <strong id="kelvinResult">--</strong>
                    </div>

                </div>
            </section>

            <footer>
                <p>Built with HTML5, CSS3 &amp; Vanilla JavaScript</p>
            </footer>

        </section>

    </main>

    <script src="logic.js"></script>
</body>
</html>
